name: Atualizar licitações

on:
  schedule:
    - cron: "17 9,15,21 * * *"   # 06h17, 12h17 e 18h17 (Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-licitacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar licitações abertas no PNCP
        run: python scripts/atualizar.py

      - name: Publicar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/licitacoes.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git commit -m "dados: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
