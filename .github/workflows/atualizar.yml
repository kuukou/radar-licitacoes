name: Atualizar licitações
on:
  schedule:
    - cron: "17 9,15,21 * * *"   # 3x por dia (06h, 12h, 18h de Brasília)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python atualizar.py
      - name: Salvar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/licitacoes.json
          git diff --cached --quiet || git commit -m "Atualiza licitações $(date -u +%F_%H%M)"
          git push
