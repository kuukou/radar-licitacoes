name: Atualizar licitações

on:
  schedule:
       - cron: "23 0,9,12,15,18,21 * * *"   # 06h23, 09h23, 12h23, 15h23, 18h23 e 21h23 (Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-licitacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Coletar licitações abertas no PNCP
        run: python scripts/atualizar.py --limite 150

      - name: Publicar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git commit -m "dados: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
